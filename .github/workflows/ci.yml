name: CI/CD Pull and Verify from GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công trên giao diện GitHub

jobs:
  verify-image:
    runs-on: ubuntu-latest
    
    # Bắt buộc: Cấp quyền đọc packages để workflow có thể tải image từ GHCR
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      # Khắc phục lỗi chữ hoa: Chuyển username thành chữ thường và lưu vào biến môi trường
      - name: Chuyển Username sang chữ thường
        run: |
          LOWERCASE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER=$LOWERCASE_OWNER" >> $GITHUB_ENV

      # Đăng nhập GHCR tự động bằng GITHUB_TOKEN (không cần tạo PAT)
      - name: Đăng nhập vào GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Kéo (Pull) image từ GHCR sử dụng biến REPO_OWNER đã viết thường
      - name: Pull Docker Image
        run: docker pull ghcr.io/${{ env.REPO_OWNER }}/payment-service:1.0.0

      # Chạy container ở chế độ nền (detached: -d) để kiểm tra
      - name: Chạy Container Verify
        run: docker run -d -p 8080:8080 --name payment-verify ghcr.io/${{ env.REPO_OWNER }}/payment-service:1.0.0

      # Kiểm tra trạng thái container đang hoạt động
      - name: Kiểm tra trạng thái Container
        run: docker ps | grep payment-verify
